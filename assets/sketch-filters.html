<!-- prototype-sketching-skill — sketch-filters.html
     Paste this block IMMEDIATELY after the opening <body> tag.
     It defines the wobble filters referenced by sketch-skin.css
     (filter: url(#sketch-NN)). The filters resolve only if these defs
     are present in the rendered DOM.

     NOTE: if you load assets/sketch-toggle.js these filters are injected
     automatically and this file is optional. -->
<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <!-- Each filter: smooth Perlin noise (feTurbulence, fractalNoise) drives a
         gentle pixel displacement (feDisplacementMap). Bigger scale = looser
         line. fractalNoise + a single octave keeps the stroke a smooth wobble
         instead of the grainy, sandpapery edge that turbulence + many octaves
         produces at high amplitude. -->
    <filter id="sketch-25" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketch-50" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketch-75" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketch-100" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
